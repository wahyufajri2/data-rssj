name: Deploy to UNISA Server via SSH

on:
  push:
    branches:
      - main

env:
  TARGET_DIR: "/var/www/embrace"

jobs:
  web-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: 1. Mengambil kode terbaru
        uses: actions/checkout@v4

      - name: 2. Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"

      - name: 3. Install Composer Dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: 4. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 5. Compile Front-End Assets
        run: |
          npm install
          npm run build

      - name: 6. Deploy via SSH (Rsync dengan Password)
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" rsync -rlgoDzvc -i --delete \
            -e "ssh -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=no" \
            --exclude='/.git/' --exclude='/node_modules/' --exclude='/.env' \
            ./ ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:${{ env.TARGET_DIR }}/

      - name: 7. Menjalankan Perintah Artisan di Server UNISA via SSH Inline
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=no ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} << 'EOF'
            cd ${{ env.TARGET_DIR }}

            echo "--- Membuat Ulang Tautan Pintasan Storage ---"
            rm -f public/storage
            php8.3 artisan storage:link

            echo "--- Memulai Optimalisasi Laravel ---"
            php8.3 artisan optimize:clear

            echo "--- Menjalankan Migrasi Database ---"
            php8.3 artisan migrate --force

            echo "--- Optimalisasi Selesai! ---"
          EOF
